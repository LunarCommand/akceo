[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "akceo"
version = "0.1.0"
description = "Build self-contained HTML slide decks from Markdown."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Chris Colinsky", email = "chris@lunarcommand.xyz" }]
# akceo is MIT. The rest covers the vendored mermaid.min.js and the packages it bundles; see
# src/akceo/assets/vendor/mermaid/THIRD_PARTY_NOTICES.
license = "MIT AND Apache-2.0 AND BSD-3-Clause AND ISC AND EPL-2.0 AND (MPL-2.0 OR Apache-2.0) AND Unlicense"
license-files = [
    "LICENSE",
    "src/akceo/assets/vendor/mermaid/LICENSE",
    "src/akceo/assets/vendor/mermaid/THIRD_PARTY_NOTICES",
]
keywords = ["slides", "presentation", "markdown", "html", "mermaid", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics :: Presentation",
]
dependencies = [
    "mini-racer>=0.14.1",
    "pillow>=10.0",
]

[project.urls]
Repository = "https://github.com/LunarCommand/akceo"
Documentation = "https://github.com/LunarCommand/akceo/blob/main/docs/syntax.md"
Changelog = "https://github.com/LunarCommand/akceo/blob/main/CHANGELOG.md"
Issues = "https://github.com/LunarCommand/akceo/issues"

[project.scripts]
akceo = "akceo.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=3.7",
    "pyright>=1.1.360",
    "pytest>=8.2",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/akceo"]

# Listed, not left to .gitignore: files kept out of git some other way, such as through
# .git/info/exclude, would otherwise land in an sdist built from a working copy.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/examples",
    "/scripts",
    "/CHANGELOG.md",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
    "/uv.lock",
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
