name: Demo

# Publishes the built demo, examples/demo/deck.html, to GitHub Pages at
# https://lunarcommand.github.io/akceo/. A test keeps that file matching a fresh build of
# examples/demo/deck.md, so this only copies it.
on:
  push:
    branches: [main]
    paths:
      - examples/demo/deck.html
      - .github/workflows/pages.yml
  workflow_dispatch:

# Read-only by default. deploy needs pages: write and id-token: write to publish.
permissions:
  contents: read

# One deployment at a time. A newer push waits rather than cancelling one that's halfway through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Stage the demo as the site's index
        run: mkdir _site && cp examples/demo/deck.html _site/index.html

      - name: Upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
